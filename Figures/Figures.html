      <svg xmlns="http://www.w3.org/2000/svg" width="1400" height="960" viewBox="0 0 1400 960" role="img" aria-labelledby="title desc">
        <title id="title">Figure 1 — Each fits with a partner—but not with each other</title>
        <desc id="desc">One-locus strict two-contributor diagram. A requires partner 1/4; B requires partner 2/4. The named pair leaves observed allele 4 unexplained. Full-profile likelihood ratios refer to thirteen independent loci.</desc>
        <style>
          text{font-family:Arial,Helvetica,sans-serif;fill:#172b3a}
          .title{font-size:30px;font-weight:bold}
          .sub{font-size:21px}

          .metric{font-size:22px}
        </style>
        <rect width="1400" height="960" fill="white"/>
        <text x="45" y="48" class="title">Figure 1 | Each fits with a partner—but not with each other</text>
        <text x="45" y="90" class="sub">One locus shown • complete observed allele set: {1, 2, 3, 4}</text>
        <text x="45" y="126" class="note">Exactly two diploid contributors; complete allele observation; no dropout, drop-in, or error.</text>
        <text x="45" y="172" class="sub">Configuration</text>
        <text x="410" y="172" class="sub">Two allele copies per person</text>
        <text x="995" y="172" class="sub">One-locus LR</text>

        <rect x="45" y="205" width="1310" height="112" rx="12" fill="#f5f7f9" stroke="#c7d0d8"/>
        <text x="65" y="245" class="sub">A + unknown</text>

        <text x="512" y="230" class="note" text-anchor="middle">A</text>
        <circle cx="475" cy="274" r="24" fill="white" stroke="#175d9c" stroke-width="2"/>
        <text x="475" y="282" class="metric" text-anchor="middle">2</text>
        <circle cx="550" cy="274" r="24" fill="white" stroke="#175d9c" stroke-width="2"/>
        <text x="550" y="282" class="metric" text-anchor="middle">3</text>
        <text x="767" y="230" class="note" text-anchor="middle">Required partner</text>
        <circle cx="730" cy="274" r="24" fill="white" stroke="#175d9c" stroke-width="2"/>
        <text x="730" y="282" class="metric" text-anchor="middle">1</text>

        <circle cx="550" cy="404" r="24" fill="white" stroke="#237455" stroke-width="2"/>

        <text x="767" y="360" class="note" text-anchor="middle">Required partner</text>

        <text x="805" y="412" class="metric" text-anchor="middle">4</text>
        <text x="629" y="412" class="metric">+</text>
        <text x="1090" y="408" class="metric" text-anchor="middle">13.2275</text>

        <rect x="45" y="465" width="1310" height="112" rx="12" fill="#f5f7f9" stroke="#c7d0d8"/>
        <text x="65" y="505" class="sub">A + B</text>
        <text x="65" y="543" class="note">Observed allele 4 unexplained</text>
        <text x="512" y="490" class="note" text-anchor="middle">A</text>
        <circle cx="475" cy="534" r="24" fill="white" stroke="#9b3f35" stroke-width="2"/>
        <text x="475" y="542" class="metric" text-anchor="middle">2</text>
        <circle cx="550" cy="534" r="24" fill="white" stroke="#9b3f35" stroke-width="2"/>
        <text x="550" y="542" class="metric" text-anchor="middle">3</text>
        <text x="767" y="490" class="note" text-anchor="middle">B</text>
        <circle cx="730" cy="534" r="24" fill="white" stroke="#9b3f35" stroke-width="2"/>
        <text x="730" y="542" class="metric" text-anchor="middle">1</text>
        <circle cx="805" cy="534" r="24" fill="white" stroke="#9b3f35" stroke-width="2"/>
        <text x="805" y="542" class="metric" text-anchor="middle">3</text>
        <text x="629" y="542" class="metric">+</text>
        <text x="1090" y="538" class="metric" text-anchor="middle">0</text>

        <text x="45" y="617" class="note">Symbols represent allele copies—not peak heights. Each separate comparison uses a different unknown partner.</text>
        <text x="45" y="660" class="sub">Full profile: thirteen independently specified loci</text>
        <text x="65" y="701" class="metric">A + unknown: LR ≈ 6.69 × 10<tspan baseline-shift="super" font-size="15">13</tspan></text>
        <text x="545" y="701" class="metric">B + unknown: LR ≈ 3.80 × 10<tspan baseline-shift="super" font-size="15">14</tspan></text>
        <text x="1060" y="701" class="metric">A + B: LR = 0</text>
        <text x="45" y="747" class="note">LRs compare each stated configuration against two unknown contributors; these are selected comparisons.</text>
        <text x="45" y="783" class="note">Unknown identities exclude A and B, not their genotypes. Contributor positions are exchangeable labels.</text>
        <text x="45" y="819" class="note">The joint zero concerns the named pair as the complete configuration under this strict two-person model.</text>
        <text x="45" y="855" class="note">It does not exclude contribution somewhere within a larger mixture or under a different observation model.</text>
        <text x="45" y="891" class="note">Hardy–Weinberg allele frequencies for 1–5: 0.07, 0.08, 0.09, 0.10, 0.66.</text>
        <text x="45" y="927" class="note">Full-profile values refer to thirteen loci, not just the single locus illustrated above.</text>
      </svg>

          <g fill="#d7ebdf" stroke="#237455">
